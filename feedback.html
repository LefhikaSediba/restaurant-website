<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback | FreshBite Restaurant</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins', sans-serif;
    background:#f8f5f1;
}

/* NAVBAR (same style as other pages) */
.navbar{
    background:#111 !important;
}

.navbar-brand{
    font-weight:700;
    color:white !important;
}

.navbar-brand span{
    color:#c5a880;
}

.nav-link{
    color:#d8d8d8 !important;
}

.nav-link:hover,
.nav-link.active{
    color:#c5a880 !important;
}

/* HERO */
.feedback-hero{
    height:45vh;
    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url('images/restaurant.jpg');
    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.feedback-hero h1{
    font-size:3rem;
    font-weight:700;
}

.feedback-hero p{
    color:#ddd;
}

/* FORM CARD */
.feedback-card{
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    transition:0.3s ease;
}

.feedback-card:hover{
    transform:translateY(-5px);
}

/* BUTTON */
.btn-gold{
    background:#c5a880;
    color:white;
    border:none;
    padding:12px;
    width:100%;
    font-weight:600;
    border-radius:10px;
}

.btn-gold:hover{
    background:#ad8d63;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand" href="index.html">
Fresh<span>Bite</span>
</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav ms-auto">

<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
<li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
<li class="nav-item"><a class="nav-link active" href="feedback.html">Feedback</a></li>

</ul>

</div>

</div>
</nav>

<!-- HERO -->
<section class="feedback-hero">
<div>
<h1>We Value Your Feedback</h1>
<p>Help us improve your experience</p>
</div>
</section>

<!-- FORM -->
<section class="container my-5">

<div class="row justify-content-center">

<div class="col-md-8 col-lg-6">

<div class="feedback-card">

<h3 class="text-center mb-4">Leave a Review</h3>

<form id="feedbackForm">

<input type="text" id="name" class="form-control mb-3" placeholder="Full Name">

<input type="email" id="email" class="form-control mb-3" placeholder="Email Address">

<input type="date" id="date" class="form-control mb-3">

<select id="rating" class="form-select mb-3">
<option value="">Select Rating</option>
<option value="5">★★★★★ Excellent</option>
<option value="4">★★★★ Very Good</option>
<option value="3">★★★ Average</option>
<option value="2">★★ Poor</option>
<option value="1">★ Terrible</option>
</select>

<textarea id="comment" class="form-control mb-3" rows="4" placeholder="Your feedback..."></textarea>

<button type="button" class="btn-gold" onclick="submitFeedback()">
Submit Feedback
</button>

</form>

</div>

</div>

</div>

</section>

<!-- FOOTER -->
<footer class="text-center p-3 bg-dark text-white mt-5">
© 2026 FreshBite Restaurant
</footer>

<!-- SCRIPT -->
<script>
function submitFeedback(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let date = document.getElementById("date").value;
let rating = document.getElementById("rating").value;
let comment = document.getElementById("comment").value;

if(!name || !email || !date || !rating || !comment){
    alert("⚠️ Please fill in all fields");
    return;
}

alert("⭐ Thank you " + name + "! Your feedback has been received.");

document.getElementById("feedbackForm").reset();
}
</script>

</body>
</html>
